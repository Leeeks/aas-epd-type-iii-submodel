# Environmental Indicator Registry
#
# This registry defines the recognized indicator-unit combinations supported by
# this version of the EPD Type III Submodel based on the standards, PCRs, and
# programme references evaluated during its development (e.g., EN 15804+A2, PEP ecopassport).
#
# It is the single source of truth for validation and documentation generation.

indicators:
  # --- Impact Indicators ---
  - indicatorCode: GWP-total
    indicatorName: Global Warming Potential (total)
    resultCategory: ImpactIndicator
    characterizationUnit: kg CO2 eq.
    baseUnit: kg
    sourceStandard: [EN 15804+A2, PEP ecopassport]
    vocabularyStatus: recognised

  - indicatorCode: GWP-fossil
    indicatorName: Global Warming Potential (fossil)
    resultCategory: ImpactIndicator
    characterizationUnit: kg CO2 eq.
    baseUnit: kg
    sourceStandard: [EN 15804+A2, PEP ecopassport]
